[pytest]
asyncio_mode = auto
# Our SQLAlchemy async engine is a process-level singleton (app/core/database.py),
# so every test must share one event loop rather than each getting its own —
# otherwise asyncpg connections get torn down against a closed loop on teardown.
# Both the fixture loop scope AND the test loop scope need to be session-level;
# pytest-asyncio tracks them separately.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
